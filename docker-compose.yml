services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vp_atelier
      POSTGRES_USER: vp_atelier
      POSTGRES_PASSWORD: vp_atelier_dev
    volumes:
      - vp_postgres_data:/var/lib/postgresql/data
    ports:
      - "5446:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vp_atelier -d vp_atelier"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: dev-secret-key-change-in-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3020,http://127.0.0.1:3020
      POSTGRES_DB: vp_atelier
      POSTGRES_USER: vp_atelier
      POSTGRES_PASSWORD: vp_atelier_dev
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SEED_DEMO: "false"
      DJANGO_SUPERUSER_PHONE: "0700000000"
      DJANGO_SUPERUSER_PASSWORD: "change-me-dev"
      DJANGO_SUPERUSER_NAME: "Admin VP"
    volumes:
      - ./backend:/app
      - vp_backend_media:/app/media
    ports:
      - "8020:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8020/api/v1
    volumes:
      - ./frontend:/app
      - vp_frontend_node_modules:/app/node_modules
      - vp_frontend_next:/app/.next
    ports:
      - "3020:3000"

volumes:
  vp_postgres_data:
  vp_backend_media:
  vp_frontend_node_modules:
  vp_frontend_next:
