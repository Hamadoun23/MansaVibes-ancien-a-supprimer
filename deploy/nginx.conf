# Internal reverse proxy (container "proxy"): one port for the whole app.
# The host's nginx terminates TLS and forwards here (127.0.0.1:8500).
upstream django { server backend:8000; }
upstream nextjs { server frontend:3000; }

server {
    listen 80;
    client_max_body_size 25m;

    # Voice notes: transcription + AI can take a while.
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location /api/   { proxy_pass http://django; }
    location /admin/ { proxy_pass http://django; }

    location /static/ {
        alias /srv/static/;
        expires 30d;
        access_log off;
    }
    location /media/ {
        alias /srv/media/;
        expires 7d;
        access_log off;
    }

    # The service worker must never be cached, or updates would not reach phones.
    location = /sw.js {
        proxy_pass http://nextjs;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / { proxy_pass http://nextjs; }
}
