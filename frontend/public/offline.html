<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0b0a" />
    <title>Hors connexion — Mansa Vibes</title>
    <style>
      :root { --bg: #f7f6f3; --ink: #111110; --muted: #8c897f; --gold: #a6853d; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0e0d0b; --ink: #f3f0e9; --muted: #8f8a7e; --gold: #c9ad74; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, sans-serif; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-family: Georgia, serif; font-weight: 500; font-size: 1.6rem; margin: 20px 0 8px; }
      p { color: var(--muted); max-width: 320px; margin: 0 auto 24px; line-height: 1.5; }
      button { height: 48px; padding: 0 24px; border: 0; border-radius: 14px; background: var(--gold);
        color: #111110; font-weight: 600; font-size: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Pas de connexion</h1>
      <p>Cette page n'a pas encore été ouverte sur ce téléphone. Les pages déjà consultées restent disponibles.</p>
      <button onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
